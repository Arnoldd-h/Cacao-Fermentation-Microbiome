name: cacao-microbiome
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.12
  - r-base=4.4
  - snakemake-minimal=8.30
  - fastqc=0.12.1
  - multiqc=1.25.1
  - cutadapt=5.0
  - sra-tools=3.1.1
  - bioconductor-dada2=1.34.0
  - bioconductor-phyloseq=1.50.0
  - bioconductor-ancombc=2.8.0
  # DADA2 1.34.0 Bioconda build requires the pre-oneTBB RcppParallel ABI.
  - r-rcppparallel=5.1.9
  # ANCOMBC 2.8.0 imports solve(), removed from the CVXR 1.9 namespace.
  - r-cvxr=1.0_15
  # Keep lme4 and Matrix on the matching ABI used by this Bioconductor release.
  - r-matrix=1.6_5
  - r-lme4=1.1_35.5
  # lmerTest 3.2 imports reformulas, but its current recipe does not install it.
  - r-reformulas
  - r-vegan=2.6_8
  - r-metafor=4.6_0
  - r-yaml=2.3.10

# Resolver con prioridad estricta dentro de Linux/WSL2. Bioconda no soporta
# Windows nativo. El lock explícito validado está en conda-linux-64.lock.
