{
  "schema_version": "1.0.0",
  "paths": {
    "dada2_dir": "results/dada2/pilot",
    "taxonomy_dir": "results/taxonomy/pilot",
    "bacterial_dir": "data/processed/pilot/bacterial",
    "filtering_dir": "results/filtering/pilot",
    "diversity_dir": "results/diversity/pilot"
  },
  "filtering": {
    "taxonomy_call": "primary",
    "minimum_bootstrap": 80,
    "tax_levels": ["Kingdom", "Phylum", "Class", "Order", "Family", "Genus"],
    "bacterial_kingdom": "Bacteria",
    "organelle_labels": ["Chloroplast", "Mitochondria"],
    "exclude_known_non_bacterial": true,
    "unclassified_kingdom_policy": "retain_and_flag",
    "low_abundance_filter": false,
    "empty_sample_policy": "fail"
  },
  "analysis": {
    "feature_level": "within_study_asv",
    "sample_aggregation": "none",
    "inference": false,
    "rarefaction": false,
    "alpha_metrics": ["observed_asvs", "shannon", "gini_simpson", "inverse_simpson", "shannon_effective"],
    "log_base": "natural",
    "primary_beta": "euclidean_clr",
    "zero_policy": "add_pseudocount_to_all_counts",
    "primary_pseudocount": 1.0,
    "sensitivity_pseudocounts": [0.5],
    "secondary_beta": "bray_curtis_relative_abundance",
    "pca_center": true,
    "pca_scale": false,
    "random_seed": 20260819,
    "validation_tolerance": 0.00000001
  },
  "figures": {
    "width_inches": 12,
    "height_inches": 6,
    "png_dpi": 300,
    "stage_colors": {"early": "#27647B", "mid": "#BC7D38", "late": "#536E3B"}
  }
}
